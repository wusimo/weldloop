[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "weldloop"
version = "0.1.0"
description = "Power-source-in-the-loop adaptive robotic welding demo (simulation only, no hardware)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "pydantic>=2.5",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]
learn = ["torch>=2.0"]
ui = ["streamlit>=1.30", "pyarrow>=14"]

[tool.setuptools.packages.find]
include = ["weldloop*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::RuntimeWarning"]
